<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>AI Tutor - Shared Session</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: #14151a; color: #e8e8ec; display: flex; flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid #2a2c33;
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header a { color: #7aa2ff; font-size: 13px; }
  main { flex: 1; overflow-y: auto; padding: 16px 20px; }
  .msg { margin-bottom: 14px; max-width: 640px; }
  .msg .who { font-size: 12px; opacity: 0.6; margin-bottom: 3px; }
  .msg.question .bubble { background: #24262e; }
  .msg.answer .bubble { background: #1c2f27; border: 1px solid #2c4a3c; }
  .bubble { padding: 10px 14px; border-radius: 10px; line-height: 1.45; font-size: 14.5px; white-space: pre-wrap; }
  footer {
    padding: 14px 20px; border-top: 1px solid #2a2c33; display: flex; gap: 8px;
  }
  input {
    background: #1c1d22; border: 1px solid #2e3038; color: #e8e8ec;
    border-radius: 8px; padding: 10px 12px; font-size: 14px;
  }
  #name { width: 140px; }
  #question { flex: 1; }
  button {
    background: #4b7bff; border: none; color: white; padding: 10px 18px;
    border-radius: 8px; font-size: 14px; cursor: pointer;
  }
  button:hover { background: #6890ff; }
</style>
</head>
<body>

<header>
  <h1>🎓 AI Tutor — {{ video_title }}</h1>
  <a href="{{ video_url }}" target="_blank">Open video ↗</a>
</header>

<main id="feed"></main>

<footer>
  <input id="name" placeholder="Your name" />
  <input id="question" placeholder="Ask the AI tutor something..." />
  <button onclick="send()">Send</button>
</footer>

<script>
  const socket = io();
  const feed = document.getElementById("feed");

  function addMessage(who, text, kind) {
    const div = document.createElement("div");
    div.className = "msg " + kind;
    div.innerHTML = `<div class="who">${who}</div><div class="bubble"></div>`;
    div.querySelector(".bubble").textContent = text;
    feed.appendChild(div);
    feed.scrollTop = feed.scrollHeight;
  }

  socket.on("new_message", (data) => {
    addMessage(data.student, data.text, data.kind);
  });

  function send() {
    const name = document.getElementById("name").value || "Student";
    const question = document.getElementById("question").value;
    if (!question.trim()) return;
    socket.emit("ask_question", { name, question });
    document.getElementById("question").value = "";
  }

  document.getElementById("question").addEventListener("keydown", (e) => {
    if (e.key === "Enter") send();
  });
</script>

</body>
</html>
